<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>茶时光 · AI 奶茶外卖原型</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f2f0ed;color:#352722;font-family:"Microsoft YaHei",sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:26px}.phone{width:min(390px,100%);min-height:844px;position:relative;overflow:hidden;padding-bottom:70px;background:#fff8ee;box-shadow:0 20px 60px #503a2c26}.top{padding:23px 20px 16px;background:#fff}.row,.section-head,.ai-head,.product-foot{display:flex;align-items:center;justify-content:space-between}.location{font-size:14px;font-weight:700}.location em{font-style:normal;color:#f44880}.search{display:flex;gap:9px;align-items:center;margin-top:14px;color:#7a6c65}.search input{width:100%;border:0;outline:0;font:13px inherit}.banner{min-height:137px;margin:16px;padding:20px 24px;border-radius:19px;display:flex;align-items:center;justify-content:space-between;background:#ffdfe8}.banner small{color:#87544b}.banner h1{font-size:25px;margin:6px 0 10px}.pill,.ai-add{border:0;border-radius:999px;padding:9px 16px;color:#fff;background:#f44880;font-weight:700}.orb{width:87px;height:87px;border-radius:50%;display:grid;place-items:center;background:#ffc3aa;font-size:42px}.ai{margin:0 16px 18px;padding:15px;border:1px solid #ffd1df;border-radius:17px;background:linear-gradient(125deg,#fff,#fff2f6)}.spark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;color:#f44880;background:#ffe0eb}.ai h2{font-size:15px;margin:2px 0}.ai small{color:#f44880;font-weight:700}.refresh{border:0;background:transparent;color:#f44880;font-size:21px}.ai p{color:#725f58;font-size:12px;line-height:1.6}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tags span{border-radius:999px;padding:4px 8px;background:#fff3e9;color:#936250;font-size:11px}.ai-add{width:100%;background:#3d2a24}.categories{display:flex;justify-content:space-between;gap:6px;padding:2px 16px 20px;overflow:auto}.cat{border:0;background:transparent;display:grid;gap:5px;justify-items:center;min-width:52px;color:#382923;font-size:11px}.cat i{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;font-size:21px;font-style:normal;background:#ffe1ea}.cat:nth-child(3n) i{background:#ffd0b9}.cat.active i{outline:3px solid #f44880}.cat.active span{color:#f44880;font-weight:700}.products{padding:0 16px}.section-head h2{margin:0;font-size:18px}.section-head button{border:0;background:transparent;color:#7a6c65;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.card{overflow:hidden;border-radius:16px;background:#fff}.visual{height:106px;display:grid;place-items:center;font-size:42px}.pink{background:#ffe1eb}.peach{background:#ffc9ae}.mint{background:#d8f0e6}.copy{padding:10px}.copy h3{margin:0 0 3px;font-size:14px}.copy p{margin:0;color:#8f8179;font-size:11px}.product-foot{margin-top:8px}.price{font-weight:700;color:#f44880}.add{width:20px;height:20px;border:2px solid #f44880;border-radius:50%;background:#fff;color:#f44880;font-size:16px;line-height:1}.nav{position:absolute;bottom:0;left:0;right:0;height:70px;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #f2ebe7}.nav button{border:0;background:transparent;color:#745f55;font:11px inherit;display:grid;place-items:center}.nav i{font-style:normal;font-size:20px}.nav button.active{color:#f44880;font-weight:700}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:#3d2a24;color:#fff;font-size:13px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:450px){.wrap{padding:0}.phone{min-height:100vh}}
  </style>
</head>
<body>
  <main class="wrap"><section class="phone">
    <header class="top"><div class="row"><div class="location"><em>⌖</em> 浦东新区 · 世纪大道⌄</div><b>♧</b></div><label class="search">⌕ <input id="search" placeholder="搜索奶茶、咖啡或门店" /></label></header>
    <section class="banner"><div><small>午后轻松喝</small><h1>第二杯半价</h1><button class="pill" onclick="notice('优惠已领取，快邀请同事拼单吧！')">马上领取</button></div><div class="orb">🧋</div></section>
    <section class="ai"><div class="row ai-head"><span class="spark">✦</span><div style="flex:1;margin-left:8px"><small>AI 今日推荐 · 模拟数据</small><h2 id="ai-title">今天，试试桂花乌龙奶茶</h2></div><button class="refresh" onclick="nextAI()">↻</button></div><p id="ai-reason">上海 28℃，而且你偏好少糖轻乳茶；它清爽不腻，适合下午开会前来一杯。</p><div class="tags" id="tags"><span>少糖</span><span>轻乳茶</span><span>下午提神</span></div><button class="ai-add" onclick="add('桂花乌龙奶茶')">加入推荐饮品 · ¥16</button></section>
    <nav class="categories" id="categories"><button class="cat active" data-cat="全部"><i>✦</i><span>全部</span></button><button class="cat" data-cat="奶茶"><i>☕</i><span>奶茶</span></button><button class="cat" data-cat="咖啡"><i>◉</i><span>咖啡</span></button><button class="cat" data-cat="果茶"><i>◌</i><span>果茶</span></button><button class="cat" data-cat="小料"><i>♧</i><span>小料</span></button></nav>
    <section class="products"><div class="section-head"><h2>推荐咖啡</h2><button>查看全部 ›</button></div><div class="grid" id="grid"></div></section>
    <nav class="nav"><button class="active"><i>⌂</i>首页</button><button><i>▣</i>点单</button><button><i>▤</i>订单</button><button><i>♙</i>我的</button></nav>
  </section></main><div id="toast" class="toast"></div>
  <script>
    const drinks=[{name:'粉云莓莓拿铁',note:'草莓奶盖 · 低因',price:18,emoji:'☕',tone:'pink',cat:'咖啡'},{name:'桂花乌龙奶茶',note:'轻乳茶 · 少糖推荐',price:16,emoji:'🥤',tone:'peach',cat:'奶茶'},{name:'青提茉莉轻茶',note:'清爽 · 0 脂',price:15,emoji:'🍵',tone:'mint',cat:'果茶'}];
    const ai=[['今天，试试桂花乌龙奶茶','上海 28℃，而且你偏好少糖轻乳茶；它清爽不腻，适合下午开会前来一杯。',['少糖','轻乳茶','下午提神'],16,'桂花乌龙奶茶'],['今天，试试粉云莓莓拿铁','你近两次选择了低因咖啡，今天有第二杯半价，和同事拼单更划算。',['低因','第二杯半价','拼单友好'],18,'粉云莓莓拿铁'],['今天，试试青提茉莉轻茶','天气偏热，按你的“清爽、少负担”偏好，推荐这杯冰饮。',['清爽','冰饮','0 脂'],15,'青提茉莉轻茶']];
    let category='全部', aiIndex=0, cart=0; const grid=document.querySelector('#grid');
    function render(){const q=document.querySelector('#search').value.trim();grid.innerHTML=drinks.filter(d=>(category==='全部'||d.cat===category)&&(`${d.name}${d.note}`).includes(q)).map(d=>`<article class="card"><div class="visual ${d.tone}">${d.emoji}</div><div class="copy"><h3>${d.name}</h3><p>${d.note}</p><div class="product-foot"><b class="price">¥${d.price}</b><button class="add" onclick="add('${d.name}')">+</button></div></div></article>`).join('')||'<p>没有匹配的饮品，换个关键词试试。</p>'}
    function notice(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
    function add(name){cart++;notice(`${name} 已加入购物车（${cart} 件）`)}
    function nextAI(){aiIndex=(aiIndex+1)%ai.length;const x=ai[aiIndex];document.querySelector('#ai-title').textContent=x[0];document.querySelector('#ai-reason').textContent=x[1];document.querySelector('#tags').innerHTML=x[2].map(t=>`<span>${t}</span>`).join('');document.querySelector('.ai-add').textContent=`加入推荐饮品 · ¥${x[3]}`;document.querySelector('.ai-add').onclick=()=>add(x[4]);notice('已按模拟偏好更新推荐')}
    document.querySelector('#search').oninput=render;document.querySelectorAll('.cat').forEach(x=>x.onclick=()=>{category=x.dataset.cat;document.querySelectorAll('.cat').forEach(y=>y.classList.remove('active'));x.classList.add('active');render()});document.querySelectorAll('.nav button').forEach(x=>x.onclick=()=>{document.querySelectorAll('.nav button').forEach(y=>y.classList.remove('active'));x.classList.add('active')});render();
  </script>
</body>
</html>
